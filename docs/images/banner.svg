<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Site Guardian — see what extensions do on every site, detect conflicts, take control">
  <defs>
    <linearGradient id="sgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accentSg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="sgGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0ea5e9" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#sgBg)"/>
  <rect width="1200" height="320" fill="url(#sgGrid)"/>
  <rect y="316" width="1200" height="4" fill="url(#accentSg)"/>

  <!-- Browser window mock (left) -->
  <g transform="translate(80,60)">
    <rect width="360" height="200" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Chrome bar -->
    <rect width="360" height="32" rx="10" fill="#1e293b"/>
    <rect y="20" width="360" height="12" fill="#1e293b"/>
    <circle cx="16" cy="16" r="4" fill="#ef4444"/>
    <circle cx="32" cy="16" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="16" r="4" fill="#10b981"/>
    <rect x="68" y="8" width="240" height="16" rx="8" fill="#0f172a"/>
    <text x="76" y="20" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#64748b">🔒 your-bank.com</text>
    <!-- Extension icons in toolbar -->
    <g transform="translate(316,8)">
      <rect width="16" height="16" rx="3" fill="#dc2626"/>
      <rect x="20" width="16" height="16" rx="3" fill="#3b82f6"/>
      <rect x="40" width="16" height="16" rx="3" fill="#10b981"/>
    </g>
    <!-- Page content placeholder -->
    <rect x="20" y="50" width="320" height="14" rx="2" fill="#334155" opacity="0.5"/>
    <rect x="20" y="74" width="240" height="10" rx="2" fill="#334155" opacity="0.4"/>
    <rect x="20" y="92" width="280" height="10" rx="2" fill="#334155" opacity="0.4"/>
    <rect x="20" y="110" width="200" height="10" rx="2" fill="#334155" opacity="0.4"/>
    <rect x="20" y="140" width="320" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="32" y="166" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Account · $12,547.89</text>
    <text x="32" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">last sync 2 min ago</text>
  </g>

  <!-- Watchful shield -->
  <g transform="translate(330,100)">
    <path d="M 60 0 L 120 25 L 120 75 Q 120 130 60 160 Q 0 130 0 75 L 0 25 Z" fill="url(#shieldGrad)" opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
    <!-- Eye -->
    <ellipse cx="60" cy="65" rx="28" ry="18" fill="#0c1426"/>
    <circle cx="60" cy="65" r="10" fill="#38bdf8"/>
    <circle cx="60" cy="65" r="4" fill="#0c1426"/>
    <!-- Check at bottom -->
    <path d="M 45 105 L 56 116 L 80 92" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Alert badge (top-right of shield) -->
  <g transform="translate(440,110)">
    <circle r="20" fill="url(#alertGrad)"/>
    <text y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">!</text>
  </g>

  <!-- Typography (right) -->
  <g transform="translate(500,100)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="0" y="0" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Site Guardian</text>
    <text x="0" y="36" font-size="17" font-weight="500" fill="#7dd3fc">See what extensions do on every site.</text>
    <text x="0" y="58" font-size="17" font-weight="500" fill="#7dd3fc">Detect conflicts. Take control.</text>

    <!-- Stat badges -->
    <g transform="translate(0,86)" font-size="11" font-weight="600">
      <g>
        <rect width="100" height="26" rx="13" fill="#0ea5e9" opacity="0.18" stroke="#0ea5e9"/>
        <text x="50" y="17" text-anchor="middle" fill="#7dd3fc">14+ conflicts</text>
      </g>
      <g transform="translate(112,0)">
        <rect width="86" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b"/>
        <text x="43" y="17" text-anchor="middle" fill="#fcd34d">Risk score</text>
      </g>
      <g transform="translate(210,0)">
        <rect width="120" height="26" rx="13" fill="#10b981" opacity="0.18" stroke="#10b981"/>
        <text x="60" y="17" text-anchor="middle" fill="#6ee7b7">Zero telemetry</text>
      </g>
      <g transform="translate(342,0)">
        <rect width="138" height="26" rx="13" fill="#a855f7" opacity="0.18" stroke="#a855f7"/>
        <text x="69" y="17" text-anchor="middle" fill="#d8b4fe">Chrome · Firefox</text>
      </g>
    </g>
  </g>
</svg>
